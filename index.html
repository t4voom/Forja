<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark light">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FORJA">
  <meta name="description" content="FORJA — treinos, cargas e evolução.">
  <title>FORJA</title>
  <link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icons/icon.svg">

  <!-- Aplica tema e preferência de movimento antes da primeira pintura (evita flash) -->
  <script>
    (function () {
      try {
        var s = JSON.parse(localStorage.getItem('forja.settings') || '{}');
        var t = s.theme || 'dark';
        if (t === 'system') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', t);
        if (s.animations === false) document.documentElement.classList.add('no-motion');
      } catch (e) {}
    })();
  </script>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      corePlugins: { preflight: true },
      theme: {
        extend: {
          colors: {
            bg: 'var(--bg)',
            surface: 'var(--surface)',
            surface2: 'var(--surface-2)',
            ink: 'var(--text)',
            muted: 'var(--text-2)',
            faint: 'var(--text-3)',
            accent: 'var(--accent)',
            sep: 'var(--sep)'
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Display"', '"SF Pro Text"', 'Inter', 'system-ui', 'sans-serif']
          }
        }
      }
    };
  </script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app" class="app" hidden>
    <header id="topbar" class="topbar" aria-hidden="true">
      <span id="topbar-title" class="topbar-title"></span>
    </header>

    <main id="view" class="view" tabindex="-1"></main>

    <nav id="tabbar" class="tabbar" aria-label="Navegação principal"></nav>
  </div>

  <!-- Treino em andamento, minimizado -->
  <button id="active-bar" class="active-bar" type="button" hidden aria-label="Voltar ao treino em andamento"></button>

  <!-- Modo treino (tela cheia, sem barra de navegação) -->
  <div id="training" class="training" hidden role="dialog" aria-modal="true" aria-label="Modo treino"></div>

  <div id="onboarding" class="onboarding" hidden></div>

  <div id="toast-host" class="toast-host" aria-live="polite"></div>

  <script src="js/utils.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/statistics.js"></script>
  <script src="js/exercises.js"></script>
  <script src="js/workouts.js"></script>
  <script src="js/sessions.js"></script>
  <script src="js/progress.js"></script>
  <script src="js/share.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
